name: Demo reusedCode detection (Phase 2)
on:
  workflow_dispatch:
  push:
    branches:
      - demo/reusedcode-phase2
    paths-ignore:
      - code.json

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run code.json generator from Phase 2 branch
        id: update
        uses: haseebmalik18/automated-codejson-generator@DSACMS/haseeb/add-gov-dependencies
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.CONTRIBUTOR_TOKEN }}
          BRANCH: demo/reusedcode-phase2
          SKIP_PR: "true"
